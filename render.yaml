services:
  - type: web
    name: pdf-render
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,read_online_store_navigation
      - key: SHOPIFY_APP_URL
        sync: false
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_BUCKET
        value: pdf-render
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
